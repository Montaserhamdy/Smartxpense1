      if (!localStorage.getItem("smartxpense_token")) {

    <style>
      .site-brand-logo {
        display: block;

    <script>
      (() => {
        const replaceBrandWallet = () => {
          const logoText = [...document.querySelectorAll("*")].find(
            (el) =>
              el.children.length === 0 &&
              /smartxpense/i.test(el.textContent || "")
          );

          if (!logoText) return;

          let container = logoText.parentElement;

          while (container && container !== document.body) {
            const wallet = container.querySelector(
              'svg.lucide-wallet, svg[data-lucide="wallet"]'
            );

            if (wallet) {
              const logo = document.createElement("img");

              logo.src = "./logo.png";
              logo.alt = "SmartXpense";
              logo.className = "site-brand-logo";

              wallet.replaceWith(logo);
              break;
            }

            container = container.parentElement;
          }
        };

        const start = () => {
          replaceBrandWallet();

          const observer = new MutationObserver(() => {
            replaceBrandWallet();
          });

          observer.observe(document.getElementById("root"), {
            childList: true,
            subtree: true,
          });
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start, {
            once: true,
          });
        } else {
          start();
        }
      })();
    </script>
