<script>
  (() => {
    const replaceBrandWallet = () => {
      const logoText = [...document.querySelectorAll("*")].find((el) => {
        return (
          el.children.length === 0 &&
          /smartxpense/i.test(el.textContent || "")
        );
      });

      if (!logoText) return;

      let brandContainer = logoText.parentElement;

      while (brandContainer && brandContainer !== document.body) {
        const wallet = brandContainer.querySelector(
          'svg.lucide-wallet, svg[data-lucide="wallet"]'
        );

        if (wallet) {
          const logo = document.createElement("img");
          logo.src = "./brand-logo.svg";
          logo.alt = "SmartXpense";
          logo.className = "site-brand-logo";

          wallet.replaceWith(logo);
          break;
        }

        brandContainer = brandContainer.parentElement;
      }
    };

    const start = () => {
      replaceBrandWallet();

      const observer = new MutationObserver(() => {
        replaceBrandWallet();
      });

      observer.observe(document.getElementById("root"), {
        childList: true,
        subtree: true,
      });
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
      start();
    }
  })();
</script>
