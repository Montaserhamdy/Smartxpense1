<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logo.png?v=2" />
    <title>SmartXpense</title>
    <script>
      if (!localStorage.getItem("smartxpense_token")) {
        window.location.href = "./login.html";
      }
    </script>
    <style>
      .site-brand-logo {
        display: block;
        width: min(72px, 76%);
        height: min(72px, 76%);
        object-fit: contain;
        flex: 0 0 auto;
      }
    </style>
    <script>
      (() => {
        const replaceBrandWallet = () => {
          document.querySelectorAll('svg[class*="wallet" i]').forEach((wallet) => {
            let brand = wallet.parentElement;
            let belongsToBrand = false;

            while (brand && brand !== document.body) {
              const text = (brand.textContent || "").toLowerCase();
              if (text.includes("smartxpense") || text.includes("مدير مصاريفك")) {
                belongsToBrand = true;
                break;
              }
              brand = brand.parentElement;
            }

            if (!belongsToBrand) return;

            const logo = document.createElement("img");
            logo.src = "./logo.png?v=2";
            logo.alt = "SmartXpense";
            logo.className = "site-brand-logo";
            wallet.replaceWith(logo);
          });
        };

        const observeBrand = () => {
          replaceBrandWallet();
          new MutationObserver(replaceBrandWallet).observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", observeBrand, { once: true });
        } else {
          observeBrand();
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CZWrS1rw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CbTxaU5Q.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
